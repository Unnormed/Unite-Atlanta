<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UA Backend · Unite Atlanta</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230D0D0D%22/><text y=%2274%22 x=%2250%22 text-anchor=%22middle%22 font-family=%22Arial Black%22 font-size=%2260%22 fill=%22%23D7F204%22>UA</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,700;0,900;1,400&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,600&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="admin-page">

<div class="gate open" id="adminGate">
  <div class="g-box">
    <h3>UA Backend</h3>
    <p>Team access only. Enter the staff code.</p>
    <form id="gateForm">
      <input id="gateInput" placeholder="STAFF CODE" autocomplete="off" aria-label="Staff code">
      <button type="submit">Enter</button>
    </form>
    <p class="g-err" id="gateErr"></p>
    <a class="g-close" href="/">Back to the site</a>
  </div>
</div>

<div id="admin">
  <div class="adm-top">
    <span class="at-brand"><i></i>UA Backend</span>
    <span class="save-state" id="saveState">Demo storage · this browser</span>
    <a class="adm-close" href="/" style="display:flex;align-items:center;text-decoration:none">Exit ✕</a>
  </div>
  <div class="adm-tabs" id="admTabs"></div>
  <div class="adm-body" id="admBody"></div>
</div>

<script src="/assets/data.js"></script>
<script>
const D = window.UA_DATA;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "ua-store-v1";
function loadStore(){
  try{ return Object.assign({submissions:[],handled:{},approvedEvents:[],subscribers:[],rsvps:{},speaksStatus:{},settings:{},customPosts:[],hiddenEvents:[],pitches:[],rejectReasons:{},owners:{}}, JSON.parse(localStorage.getItem(KEY)||"{}")); }
  catch(e){ return {submissions:[],handled:{},approvedEvents:[],subscribers:[],rsvps:{},speaksStatus:{},settings:{},customPosts:[],hiddenEvents:[],pitches:[],rejectReasons:{},owners:{}}; }
}
let ST = loadStore();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); setSave("Saved · demo storage in this browser","ok"); }catch(e){ setSave("Could not save","err"); } }
function setSave(t,c){ const el=$("#saveState"); el.textContent=t; el.className="save-state "+(c||""); }

const SETTINGS = () => Object.assign({}, D.settings, ST.settings);
const TYPES = {
  mixer:{label:"Mixer",bg:"#D7F204",fg:"#0D0D0D"}, panel:{label:"Panel",bg:"#858AE3",fg:"#0D0D0D"},
  listening:{label:"Listening",bg:"#613DC1",fg:"#F2EFE9"}, performance:{label:"Performance",bg:"#FF4A1C",fg:"#0D0D0D"},
  civic:{label:"Civic",bg:"#F2EFE9",fg:"#0D0D0D"}, legacy:{label:"Legacy",bg:"#FF9F1C",fg:"#0D0D0D"},
  other:{label:"Other",bg:"#CFC9BD",fg:"#0D0D0D"}
};

/* all submissions = baseline samples (status via ST.handled) + browser-added */
function allSubs(){
  const base = D.submissions.map(s => Object.assign({}, s, {status: ST.handled[s.id] || s.status}));
  return base.concat(ST.submissions.map(s => Object.assign({}, s, {status: ST.handled[s.id] || s.status})));
}
function allPitches(){
  const base = (D.pitches||[]).map(x => Object.assign({}, x, {status: ST.handled[x.id] || x.status}));
  return base.concat((ST.pitches||[]).map(x => Object.assign({}, x, {status: ST.handled[x.id] || x.status})));
}
const OPS = D.ops || {criteria:[],rejectReasons:[],roles:[],speaksPolicy:[],steps:[]};
function speaksAll(){ return D.speaks.map(p => Object.assign({}, p, {status: ST.speaksStatus[p.id] || p.status})); }
function customPosts(){ return ST.customPosts || []; }
function allEvents(){ return D.events.filter(e=>!(ST.hiddenEvents||[]).includes(e.id)).concat(ST.approvedEvents); }
function hiddenEventsList(){ return D.events.filter(e=>(ST.hiddenEvents||[]).includes(e.id)); }
function rsvpOf(id){ return Array.isArray(ST.rsvps[id]) ? ST.rsvps[id].length : 0; }
function rsvpEntries(id){ return Array.isArray(ST.rsvps[id]) ? ST.rsvps[id] : []; }

/* gate */
try{ if(sessionStorage.getItem("ua-admin")==="1"){ $("#adminGate").classList.remove("open"); $("#admin").classList.add("open"); } }catch(e){}
$("#gateForm").addEventListener("submit",ev=>{
  ev.preventDefault();
  if($("#gateInput").value.trim().toUpperCase()===SETTINGS().adminCode.toUpperCase()){
    try{ sessionStorage.setItem("ua-admin","1"); }catch(e){}
    $("#adminGate").classList.remove("open");
    $("#admin").classList.add("open");
    renderAdmin();
  } else { $("#gateErr").textContent="Wrong code."; $("#gateInput").value=""; }
});

let admTab = "overview";
function renderAdmin(){
  const pending = allSubs().filter(s=>s.status==="pending").length;
  let rsvpTotal = 0; Object.keys(ST.rsvps).forEach(id=> rsvpTotal += rsvpOf(id));
  const pendingPitches = allPitches().filter(x=>x.status==="pending").length;
  const tabs = [["overview","Overview",0],["submissions","Submissions",pending],["events","Events",0],["rsvps","RSVPs",rsvpTotal],["speaks","Atlanta Speaks",pendingPitches],["subscribers","Subscribers",0],["ops","Operations",0],["settings","Settings",0]];
  $("#admTabs").innerHTML = tabs.map(([k,l,b])=>`<button class="${admTab===k?"on":""}" data-t="${k}">${l}${b?`<span class="badge">${b}</span>`:""}</button>`).join("");
  document.querySelectorAll("#admTabs button").forEach(b=>b.addEventListener("click",()=>{admTab=b.dataset.t;renderAdmin();}));
  const body = $("#admBody");
  if(admTab==="overview") body.innerHTML = admOverview();
  if(admTab==="submissions") body.innerHTML = admSubmissions();
  if(admTab==="events") body.innerHTML = admEvents();
  if(admTab==="rsvps") body.innerHTML = admRsvps();
  if(admTab==="speaks") body.innerHTML = admSpeaks();
  if(admTab==="subscribers") body.innerHTML = admSubscribers();
  if(admTab==="ops") body.innerHTML = admOps();
  if(admTab==="settings") body.innerHTML = admSettings();
}
function admOverview(){
  const pending = allSubs().filter(s=>s.status==="pending").length;
  const pubs = speaksAll().filter(p=>p.status==="published").length;
  const subs = D.subscribers.length + ST.subscribers.length;
  let total = 0; Object.keys(ST.rsvps).forEach(id=> total += rsvpOf(id));
  const top = allEvents().map(e=>({e,n:rsvpOf(e.id)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,5);
  return `
    <div class="adm-grid">
      <div class="stat"><span class="k">Pending submissions</span><div class="v ${pending?"red":""}">${pending}</div></div>
      <div class="stat"><span class="k">Pending pitches</span><div class="v ${allPitches().filter(x=>x.status==="pending").length?"red":""}">${allPitches().filter(x=>x.status==="pending").length}</div></div>
      <div class="stat"><span class="k">Live events</span><div class="v">${allEvents().length}</div></div>
      <div class="stat"><span class="k">Published posts</span><div class="v">${pubs}</div></div>
      <div class="stat"><span class="k">Subscribers</span><div class="v">${subs}</div></div>
      <div class="stat"><span class="k">Total RSVPs</span><div class="v">${total}</div></div>
    </div>
    <h3 class="adm-h">Most RSVP'd events</h3>
    <div class="adm-rows">${top.map(({e,n})=>`<div class="adm-row"><span class="ar-t">${esc(e.title)}<small>${e.d} · ${esc(e.venue)}</small></span><span class="st pub">${n} RSVPs</span></div>`).join("")||'<div class="adm-row"><span class="ar-t">No RSVPs yet.</span></div>'}</div>
    <p class="adm-note">Demo build: actions are stored in this browser. The production backend gets a real database and per-user accounts; this preview shows the full workflow.</p>`;
}
function admSubmissions(){
  const pending = allSubs().filter(s=>s.status==="pending");
  const done = allSubs().filter(s=>s.status!=="pending");
  const card = s => {
    const c = TYPES[s.type]||TYPES.other;
    return `<div class="sub-card">
      <div class="sc-top">
        <div class="sc-img">${s.img?`<img src="${s.img}" alt="">`:`<span class="noimg">No flyer uploaded</span>`}</div>
        <div class="sc-main">
          <h4>${esc(s.title)}</h4>
          <div class="sc-tags">
            <span style="--pc:${c.bg};--fc:${c.fg}">${c.label}</span>
            <span>${s.tier==="plus"?"Plus ■":"Open"}</span>
            <span>${esc(s.d)} · ${esc(s.t)}</span>
            ${s.sample?`<span style="opacity:.55">Sample</span>`:""}
          </div>
          <p class="sc-desc">${esc(s.desc)}</p>
          <p class="sc-meta">Venue: ${esc(s.venue)} · By ${esc(s.name)}${s.org?` (${esc(s.org)})`:""} &lt;${esc(s.email)}&gt;${s.social?` · <a href="${esc(s.social)}" target="_blank" rel="noopener">${esc(s.social)}</a>`:""}</p>
        </div>
      </div>
      <div class="sc-check" id="ck-${s.id}">
        <p class="crit-h">Listing criteria · tick all five to approve</p>
        ${OPS.criteria.map(c=>`<label class="check"><input type="checkbox" onchange="admCritChange('${s.id}')"><span>${esc(c.label)}</span></label>`).join("")}
      </div>
      <div class="sc-actions">
        <button class="approve" id="ap-${s.id}" disabled onclick="admApprove('${s.id}')">Approve → publish to calendar</button>
        <select class="rej-sel" id="rr-${s.id}" aria-label="Reason for declining">${OPS.rejectReasons.map(r=>`<option>${esc(r)}</option>`).join("")}</select>
        <button class="reject" onclick="admReject('${s.id}')">Decline</button>
      </div>
    </div>`;
  };
  return `<h3 class="adm-h" style="margin-top:0">Awaiting review (${pending.length})</h3>
    ${pending.map(card).join("")||'<p class="adm-note">Queue is empty. The city is quiet. Suspicious.</p>'}
    <h3 class="adm-h">Handled</h3>
    <div class="adm-rows">${done.map(s=>`<div class="adm-row"><span class="ar-t">${esc(s.title)}<small>${esc(s.d)} · by ${esc(s.name)}</small></span>${s.status!=="approved"&&ST.rejectReasons&&ST.rejectReasons[s.id]?`<span class="st">${esc(ST.rejectReasons[s.id])}</span>`:""}<span class="st ${s.status==="approved"?"pub":"rej"}">${s.status==="approved"?"approved":"declined"}</span></div>`).join("")||'<div class="adm-row"><span class="ar-t">Nothing handled yet.</span></div>'}</div>
    <p class="adm-note">Nothing reaches the calendar without a review. Approve unlocks once all five criteria are ticked; a declined event keeps its reason so the organizer can be told why. Criteria and reasons are set under Operations.</p>`;
}
function admCritChange(id){
  const box = document.getElementById("ck-"+id), btn = document.getElementById("ap-"+id);
  if(!box || !btn) return;
  const all = box.querySelectorAll("input[type=checkbox]"), on = box.querySelectorAll("input[type=checkbox]:checked");
  btn.disabled = on.length !== all.length;
}
function admApprove(id){
  const s = allSubs().find(x=>x.id===id); if(!s) return;
  ST.handled[id] = "approved";
  ST.approvedEvents.push({ id:"u"+Date.now(), d:s.d, t:s.t, title:s.title, venue:s.venue, type:s.type, tier:s.tier, desc:s.desc||"Community submission.", img:s.img||null, social:s.social||null });
  save(); renderAdmin();
}
function admReject(id){
  const sel = document.getElementById("rr-"+id);
  ST.rejectReasons = ST.rejectReasons || {};
  ST.rejectReasons[id] = sel ? sel.value : "Other";
  ST.handled[id] = "rejected"; save(); renderAdmin();
}
function admEvents(){
  const rows = allEvents().slice().sort((a,b)=>a.d.localeCompare(b.d)).map(e=>{
    const c = TYPES[e.type]||TYPES.other;
    const community = String(e.id).startsWith("u");
    return `<div class="adm-row">
      <span class="ar-t">${esc(e.title)}<small>${e.d} · ${e.t} · ${esc(e.venue)}</small></span>
      <span class="st" style="background:${c.bg};color:${c.fg}">${c.label}</span>
      <span class="st ${e.tier==="plus"?"pub":""}">${e.tier==="plus"?"Plus":"Open"}</span>
      <span class="st ${community?"pub":"dft"}">${community?"community":"editorial"}</span>
      <button class="mini" style="background:var(--scarlet)" onclick="admRemoveEvent('${e.id}')">Remove</button>
    </div>`;
  }).join("");
  const hidden = hiddenEventsList().map(e=>`<div class="adm-row">
      <span class="ar-t">${esc(e.title)}<small>${e.d} · ${esc(e.venue)}</small></span>
      <span class="st rej">removed</span>
      <button class="mini" onclick="admRestoreEvent('${e.id}')">Restore</button>
    </div>`).join("");
  return `<h3 class="adm-h" style="margin-top:0">On the calendar (${allEvents().length})</h3>
    <div class="adm-rows">${rows||'<div class="adm-row"><span class="ar-t">The calendar is empty.</span></div>'}</div>
    ${hidden?`<h3 class="adm-h">Removed</h3><div class="adm-rows">${hidden}</div>`:""}
    <p class="adm-note">Remove takes an event off the calendar, Next Up and the Back Room immediately. Editorial events can be restored; community events are gone for good.</p>`;
}
function admRemoveEvent(id){
  const idx = ST.approvedEvents.findIndex(e=>e.id===id);
  if(idx >= 0){ ST.approvedEvents.splice(idx,1); }
  else {
    ST.hiddenEvents = ST.hiddenEvents || [];
    if(!ST.hiddenEvents.includes(id)) ST.hiddenEvents.push(id);
  }
  save(); renderAdmin();
}
function admRestoreEvent(id){
  ST.hiddenEvents = (ST.hiddenEvents||[]).filter(x=>x!==id);
  save(); renderAdmin();
}
function admRsvps(){
  const withRsvps = allEvents().map(e=>({e, entries: rsvpEntries(e.id)})).filter(x=>x.entries.length>0);
  if(!withRsvps.length) return '<h3 class="adm-h" style="margin-top:0">Guest lists</h3><p class="adm-note" style="margin-top:0">No RSVPs yet. Every RSVP made on this site (in this browser) lands here with name, email and ticket code.</p>';
  return '<h3 class="adm-h" style="margin-top:0">Guest lists</h3>' + withRsvps.map(({e,entries})=>`
    <h3 class="adm-h" style="font-size:19px">${esc(e.title)} <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.1em">· ${e.d} · ${entries.length} on the list</span></h3>
    <div class="adm-rows">${entries.map(r=>`<div class="adm-row"><span class="ar-t">${esc(r.name)}<small>${esc(r.email)}</small></span><span class="st pub">${esc(r.code)}</span><span class="st">${esc(r.ts)}</span></div>`).join("")}</div>`).join("");
}
function kindOf(p){ return `${esc(p.kind||"Opinion")} · ${p.source==="community"?"community pitch":"commissioned"}`; }
function admSpeaks(){
  const customRows = customPosts().map(p=>`<div class="adm-row">
      <span class="ar-t">${esc(p.title)}<small>${esc(p.name)} · ${esc(p.role)} · ${esc(p.date)} · ${kindOf(p)}</small></span>
      <span class="st ${p.status==="published"?"pub":"dft"}">${p.status}</span>
      <button class="mini" onclick="admToggleCustom('${p.id}')">${p.status==="published"?"Unpublish":"Publish"}</button>
      <a class="mini" style="text-decoration:none" href="/speaks/post?id=${p.id}" target="_blank" rel="noopener">View page</a>
      <button class="mini" style="background:var(--scarlet)" onclick="admDeleteCustom('${p.id}')">Delete</button>
    </div>`).join("");
  const pend = allPitches().filter(x=>x.status==="pending");
  const pitchCards = pend.map(x=>`<div class="sub-card">
      <div class="sc-top"><div class="sc-main">
        <h4>${esc(x.title)}</h4>
        <div class="sc-tags"><span>${esc(x.kind)}</span><span>Community pitch</span>${x.sample?`<span style="opacity:.55">Sample</span>`:""}</div>
        <p class="sc-desc">${esc(x.pitch)}</p>
        <p class="sc-meta">By ${esc(x.name)} · ${esc(x.role)} &lt;${esc(x.email)}&gt;${x.link?` · <a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.link)}</a>`:""}</p>
      </div></div>
      <div class="sc-actions">
        <button class="approve" onclick="admAcceptPitch('${x.id}')">Accept → open as draft</button>
        <button class="reject" onclick="admDeclinePitch('${x.id}')">Decline</button>
      </div>
    </div>`).join("");
  return `<h3 class="adm-h" style="margin-top:0">Community pitches (${pend.length})</h3>
    ${pitchCards||'<p class="adm-note" style="margin-top:0">No pitches waiting. Pitches sent through "Pitch a piece" on the site land here.</p>'}
    <p class="adm-note">Accepting a pitch opens it as a draft below, credited to the author. Nothing is published until the Speaks editor edits it and presses Publish.</p>
    <h3 class="adm-h">Write a new post</h3>
    <div class="sub-card" style="padding:16px">
      <form id="newPostForm" style="display:flex;flex-direction:column;gap:12px" onsubmit="admCreatePost(event)">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <label style="display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase">Author name<input required name="name" style="border:2px solid var(--ink);padding:10px 12px;font-family:inherit;font-size:14px"></label>
          <label style="display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase">Role / neighborhood<input required name="role" placeholder="DJ · West End" style="border:2px solid var(--ink);padding:10px 12px;font-family:inherit;font-size:14px"></label>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <label style="display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase">Type<select name="kind" style="border:2px solid var(--ink);padding:10px 12px;font-family:inherit;font-size:14px;background:#fff"><option>Opinion</option><option>Event recap</option><option>Legacy story</option></select></label>
          <label style="display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase">How it came in<select name="source" style="border:2px solid var(--ink);padding:10px 12px;font-family:inherit;font-size:14px;background:#fff"><option value="commissioned">Commissioned by the editor</option><option value="community">Community pitch</option></select></label>
        </div>
        <label style="display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase">Title<input required name="title" style="border:2px solid var(--ink);padding:10px 12px;font-family:inherit;font-size:14px"></label>
        <label style="display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase">Pull quote (one sentence)<input required name="quote" style="border:2px solid var(--ink);padding:10px 12px;font-family:inherit;font-size:14px"></label>
        <label style="display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase">Article (blank line = new paragraph)<textarea required name="body" rows="8" style="border:2px solid var(--ink);padding:10px 12px;font-family:inherit;font-size:14px;resize:vertical"></textarea></label>
        <label style="display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase">Portrait (optional)<input type="file" id="postImg" accept="image/*" style="border:2px solid var(--ink);padding:8px;font-family:var(--font-mono);font-size:11px"></label>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="mini2" style="margin-top:0" type="submit" name="pub" value="published">Publish now</button>
          <button class="mini" type="submit" name="pub" value="draft">Save as draft</button>
        </div>
      </form>
    </div>
    ${customRows?`<h3 class="adm-h">Your posts</h3><div class="adm-rows">${customRows}</div>`:""}
    <h3 class="adm-h">Editorial posts</h3>
    <div class="adm-rows">${speaksAll().map(p=>`<div class="adm-row">
      <span class="ar-t">${esc(p.title)}<small>${esc(p.name)} · ${esc(p.role)} · ${esc(p.date)} · ${kindOf(p)}</small></span>
      <span class="st ${p.status==="published"?"pub":"dft"}">${p.status}</span>
      <button class="mini" onclick="admTogglePost('${p.id}')">${p.status==="published"?"Unpublish":"Publish"}</button>
      <a class="mini" style="text-decoration:none" href="/speaks/${p.slug}" target="_blank" rel="noopener">View page</a>
    </div>`).join("")}</div>
    <p class="adm-note">Published posts appear in the Atlanta Speaks journal on the homepage, each with its own page. Posts you write here are stored in this browser (demo); the production build moves them to a real database.</p>`;
}
let postImgUri = null;
document.addEventListener("change", ev=>{
  if(ev.target && ev.target.id === "postImg"){
    const f = ev.target.files && ev.target.files[0]; if(!f) return;
    const img = new Image();
    img.onload = () => {
      const maxW = 900, scale = Math.min(1, maxW/img.width);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      postImgUri = cv.toDataURL("image/jpeg",.72);
    };
    img.src = URL.createObjectURL(f);
  }
});
function admCreatePost(ev){
  ev.preventDefault();
  const f = new FormData(ev.target);
  const status = (ev.submitter && ev.submitter.value) || "draft";
  const MONTH_SHORT = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const now = new Date();
  const paras = String(f.get("body")).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  ST.customPosts = customPosts();
  ST.customPosts.unshift({
    id: "c"+Date.now(), name:String(f.get("name")), role:String(f.get("role")),
    title:String(f.get("title")), quote:String(f.get("quote")), body: paras,
    kind:String(f.get("kind")||"Opinion"), source:String(f.get("source")||"commissioned"),
    img: postImgUri, status,
    date: status==="published" ? MONTH_SHORT[now.getMonth()]+" "+now.getDate()+", "+now.getFullYear() : "UNPUBLISHED"
  });
  postImgUri = null;
  save(); renderAdmin();
}
function admAcceptPitch(id){
  const x = allPitches().find(q=>q.id===id); if(!x) return;
  ST.handled[id] = "accepted";
  const first = String(x.pitch).split(/(?<=[.!?])\s+/)[0] || x.title;
  ST.customPosts = customPosts();
  ST.customPosts.unshift({ id:"c"+Date.now(), name:x.name, role:x.role, title:x.title, quote:first, body:[x.pitch],
    kind:x.kind, source:"community", img:null, status:"draft", date:"UNPUBLISHED" });
  save(); renderAdmin();
}
function admDeclinePitch(id){ ST.handled[id] = "declined"; save(); renderAdmin(); }
function admToggleCustom(id){
  const p = customPosts().find(x=>x.id===id); if(!p) return;
  p.status = p.status==="published" ? "draft" : "published";
  if(p.status==="published" && p.date==="UNPUBLISHED"){
    const MONTH_SHORT = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    const now = new Date();
    p.date = MONTH_SHORT[now.getMonth()]+" "+now.getDate()+", "+now.getFullYear();
  }
  save(); renderAdmin();
}
function admDeleteCustom(id){
  ST.customPosts = customPosts().filter(x=>x.id!==id);
  save(); renderAdmin();
}
function admTogglePost(id){
  const p = speaksAll().find(x=>x.id===id); if(!p) return;
  ST.speaksStatus[id] = p.status==="published" ? "draft" : "published";
  save(); renderAdmin();
}
function admSubscribers(){
  const rows = D.subscribers.concat(ST.subscribers);
  return `<h3 class="adm-h" style="margin-top:0">Newsletter list (${rows.length})</h3>
    <div class="adm-rows">${rows.slice().reverse().map(s=>`<div class="adm-row"><span class="ar-t">${esc(s.email)}</span><span class="st">${esc(s.ts)}</span></div>`).join("")||'<div class="adm-row"><span class="ar-t">No subscribers yet.</span></div>'}</div>`;
}
function admOps(){
  const owners = ST.owners || {};
  return `<h3 class="adm-h" style="margin-top:0">Who owns what</h3>
    <div class="adm-rows">${OPS.roles.map(r=>`<div class="adm-row">
      <span class="ar-t">${esc(r.title)}<small>${esc(r.load)}</small><span class="ar-d">${esc(r.does)}</span></span>
      <input class="own-in" id="own-${r.id}" value="${esc(owners[r.id]||"")}" placeholder="Owner: to be decided" aria-label="Owner of ${esc(r.title)}">
    </div>`).join("")}</div>
    <button class="mini2" style="margin-top:12px;border:2px solid var(--ink);background:var(--lime);font-family:var(--font-display);font-size:15px;text-transform:uppercase;padding:10px 20px" onclick="admSaveOwners()">Save owners</button>
    <p class="adm-note">Proposal v1. Names saved here show on the "How it runs" section of the site (demo: in this browser). One person can hold more than one role; the time estimates assume launch volume and should be checked after the first month.</p>
    <h3 class="adm-h">Listing criteria</h3>
    <div class="adm-rows">${OPS.criteria.map((c,i)=>`<div class="adm-row"><span class="st pub">${String(i+1).padStart(2,"0")}</span><span class="ar-t">${esc(c.label)}<small>${esc(c.hint)}</small></span></div>`).join("")}</div>
    <h3 class="adm-h">Reasons for declining an event</h3>
    <div class="adm-rows"><div class="adm-row" style="gap:8px">${OPS.rejectReasons.map(r=>`<span class="st">${esc(r)}</span>`).join("")}</div></div>
    <h3 class="adm-h">How Atlanta Speaks works</h3>
    <div class="adm-rows">${OPS.speaksPolicy.map(x=>`<div class="adm-row"><span class="ar-t">${esc(x.t)}<small>${esc(x.d)}</small></span></div>`).join("")}</div>
    <p class="adm-note">Open decisions for the team: who holds each role, whether Speaks pays for commissioned pieces, how often a new piece runs, and who signs off on Plus invitations.</p>`;
}
function admSaveOwners(){
  ST.owners = ST.owners || {};
  OPS.roles.forEach(r=>{ const el = document.getElementById("own-"+r.id); if(el) ST.owners[r.id] = el.value.trim(); });
  save(); renderAdmin();
}
function admSettings(){
  return `<div class="adm-settings">
    <h3 class="adm-h" style="margin-top:0">Plus access code</h3>
    <label>Current code<input id="setPlusCode" value="${esc(SETTINGS().plusCode)}"></label>
    <label style="margin-top:12px">Rotates on<input id="setRotates" value="${esc(SETTINGS().codeRotates)}"></label>
    <button class="mini2" onclick="admSaveSettings()">Save</button>
    <h3 class="adm-h">Staff code</h3>
    <p class="adm-note" style="margin-top:0">Backend access code: <b>${esc(SETTINGS().adminCode)}</b>. This demo checks the code client-side; the production build moves auth and data behind a real server.</p>
  </div>`;
}
function admSaveSettings(){
  ST.settings.plusCode = $("#setPlusCode").value.trim() || SETTINGS().plusCode;
  ST.settings.codeRotates = $("#setRotates").value.trim() || SETTINGS().codeRotates;
  save();
}
renderAdmin();
</script>
</body>
</html>
